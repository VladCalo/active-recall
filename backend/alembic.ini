# Alembic Configuration File
#
# This file configures Alembic for database migrations.
# For detailed documentation, see: https://alembic.sqlalchemy.org/

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
# file_template = %%(rev)s_%%(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for revision timestamps
# timezone =

# Max length of characters to apply to "slug" field
truncate_slug_length = 40

# Set to 'true' to run migrations offline
# revision_environment = false

# Set to 'true' to enable batch mode (required for SQLite ALTER TABLE)
# sourceless = false

# Version path separator (os-specific by default)
# version_path_separator = os

# Output encoding
# output_encoding = utf-8

# SQLAlchemy URL - overridden in env.py to use app config
sqlalchemy.url = sqlite:///./app.db


[post_write_hooks]
# Post-write hooks for formatting generated files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
