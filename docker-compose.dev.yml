# Active Recall Monitor - Development Docker Compose Override
#
# Use this for local development with hot reloading.
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Note: For local development, it's usually easier to run
# backend and frontend separately without Docker.

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      target: production
    environment:
      - DEBUG=true
    volumes:
      # Mount source code for development
      - ./backend:/app
      # Exclude __pycache__
      - /app/__pycache__
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
