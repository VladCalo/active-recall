# Active Recall Monitor - Production Docker Compose for RPi5
#
# This configuration:
# - Stores database in /mnt/ssd/apps/active-recall/data/db (persistent)
# - Stores Redis in /mnt/ssd/apps/active-recall/data/redis (persistent)
# - Runs on ports 7070 (backend) and 80 (frontend)
# - Auto-restarts on failure
# - Includes Redis for rate limiting
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#
# Backend requires .env with JWT_SECRET_KEY, CSRF_SECRET_KEY. For first deploy
# set ADMIN_EMAIL and ADMIN_PASSWORD, or ADMIN_ALLOW_DEFAULT=true to allow defaults.

services:
  # ==========================================================================
  # Redis - Rate limiting and session storage
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: active-recall-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - ${DATA_DIR:-/mnt/ssd/apps/active-recall/data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  # ==========================================================================
  # Backend - FastAPI application
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: active-recall-backend
    restart: always
    ports:
      - "7070:7070"
    environment:
      - ENVIRONMENT=production
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=sqlite:////data/active-recall.db
      - REDIS_URL=redis://redis:6379/0
      - DEFAULT_TIMEZONE=Europe/Bucharest
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - CSRF_SECRET_KEY=${CSRF_SECRET_KEY:?CSRF_SECRET_KEY is required}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAMESITE=lax
      # Include your access URL if you use IP, e.g. ["http://rpi5.local","http://192.168.1.50"]
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://rpi5.local","http://rpi5"]}
      - MIN_PASSWORD_LENGTH=10
      - RATE_LIMIT_LOGIN=${RATE_LIMIT_LOGIN:-20/5minute}
      # Admin account - CHANGE THESE IN PRODUCTION!
      - ADMIN_EMAIL=${ADMIN_EMAIL:-adminvladcalo}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Adminvladcalo123!}
      - ADMIN_ALLOW_DEFAULT=${ADMIN_ALLOW_DEFAULT:-false}
    volumes:
      - ${DATA_DIR:-/mnt/ssd/apps/active-recall/data}/db:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7070/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-network

  # ==========================================================================
  # Frontend - React application served by Nginx
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: active-recall-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
