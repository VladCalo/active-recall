# Active Recall Monitor - Docker Compose Configuration
#
# This file orchestrates the backend and frontend services.
# 
# Usage:
#   Development: docker-compose up --build
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Services:
#   - backend:  FastAPI application on port 7070
#   - frontend: React app served by nginx on port 80/5173

version: '3.8'

services:
  # ==========================================================================
  # Backend Service - FastAPI + SQLite
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: active-recall-backend
    ports:
      - "7070:7070"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite:///./app.db
      - DEFAULT_TIMEZONE=Europe/Bucharest
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - COOKIE_SECURE=true
      - CORS_ORIGINS=["http://localhost:5173"]
    volumes:
      # Persist SQLite database
      - backend_data:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7070/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # Frontend Service - React + Nginx
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: active-recall-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
    driver: local
