# Active Recall Monitor - Docker Compose Configuration
#
# Production-ready setup with:
# - Backend (FastAPI) on port 7070
# - Frontend (React/Nginx) on port 80/5173
# - Redis for rate limiting and session management
#
# Usage:
#   Development: docker-compose up --build
#   Production:  docker-compose --profile production up -d
#
# Required environment variables for production:
#   JWT_SECRET_KEY - Generate with: python -c "import secrets; print(secrets.token_urlsafe(64))"
#   CSRF_SECRET_KEY - Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"

services:
  # ==========================================================================
  # Redis - Rate limiting and session storage
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: active-recall-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ==========================================================================
  # Backend - FastAPI application
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: active-recall-backend
    restart: unless-stopped
    ports:
      - "7070:7070"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=sqlite:///./app.db
      - REDIS_URL=redis://redis:6379/0
      - DEFAULT_TIMEZONE=Europe/Bucharest
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required for production}
      - CSRF_SECRET_KEY=${CSRF_SECRET_KEY:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173","http://localhost"]}
      - MIN_PASSWORD_LENGTH=${MIN_PASSWORD_LENGTH:-12}
      - RATE_LIMIT_LOGIN=${RATE_LIMIT_LOGIN:-5/5minute}
      - RATE_LIMIT_REGISTER=${RATE_LIMIT_REGISTER:-3/10minute}
      - RATE_LIMIT_REFRESH=${RATE_LIMIT_REFRESH:-30/minute}
    volumes:
      - backend_data:/app
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7070/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  # ==========================================================================
  # Frontend - React application served by Nginx
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: active-recall-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

volumes:
  redis_data:
    driver: local
  backend_data:
    driver: local

networks:
  app-network:
    driver: bridge
